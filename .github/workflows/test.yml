name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  file-evidence:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: packages/file-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/file-evidence/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the extension manifest and referenced files
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
            if (m.manifest_version !== 3) throw new Error("manifest_version must be 3");
            const files = [m.background.service_worker, m.side_panel.default_path, ...Object.values(m.icons), ...m.content_scripts.flatMap(s => s.js)];
            for (const f of files) if (!fs.existsSync("extension/" + f)) throw new Error("missing " + f);
            console.log("manifest ok:", files.length, "files");
          '
